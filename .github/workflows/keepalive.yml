name: Manter Supabase ativo

# Projetos no plano Free do Supabase pausam após ~7 dias de inatividade.
# Este cron faz uma chamada leve por dia, que executa uma query no banco e
# reinicia o contador de inatividade — sem tocar em nenhum dado.
#
# Precisa rodar FORA do Supabase (aqui, no GitHub Actions): um cron interno
# pausaria junto com o projeto. Usa a função pública get_shared_archive como
# "ping": ela roda uma query real e devolve null para um token inexistente.

on:
  schedule:
    # Todo dia por volta das 12:17 UTC (~09:17 no horário de Brasília).
    # O horário do GitHub Actions pode atrasar em picos; como o limite é de
    # ~7 dias, um disparo diário dá folga de sobra mesmo se algum dia falhar.
    - cron: '17 12 * * *'
  workflow_dispatch: # permite disparar manualmente pela aba Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping no Supabase (RPC pública)
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "$SUPABASE_URL/rest/v1/rpc/get_shared_archive" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{"p_token":"keepalive"}')
          echo "Resposta HTTP: $code"
          if [ "$code" -ge 400 ]; then
            echo "::error::Ping falhou (HTTP $code). O projeto pode estar pausado ou fora do ar."
            exit 1
          fi
          echo "Ping OK — atividade registrada no Supabase."
